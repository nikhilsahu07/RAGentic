[project]
name = "ragentic-backend"
version = "0.1.0"
description = "Agentic RAG Microservice Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "google-generativeai>=0.8.3",
    "pymilvus>=2.4.9",
    "langchain>=0.3.7",
    "langchain-community>=0.3.7",
    "langchain-text-splitters>=0.3.2",
    "pypdf>=5.1.0",
    "rank-bm25>=0.2.2",
    "boto3>=1.35.72",
    "structlog>=24.4.0",
    "python-multipart>=0.0.17",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
    "boto3-stubs[s3]>=1.35.72",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
